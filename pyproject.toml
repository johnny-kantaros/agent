[project]
name = "agent"
version = "0.1.0"
description = "Personal Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "python-dotenv>=1.0.1",
    "openai>=2.24.0",
    "requests>=2.32.5",
    "uvicorn>=0.41.0",
    "google-api-python-client>=2.193.0",
    "google-cloud-storage>=3.10.0",
    "google-search-results>=2.4.2",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
    "types-requests>=2.32.4.20260107",
]

[tool.ruff]
line-length = 100
target-version = "py311"

lint.select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

lint.ignore = [
    "E501"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
